name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Keep the APK with the run
        uses: actions/upload-artifact@v4
        with:
          name: taskline-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK as a download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Taskline.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Taskline.apk \
            --title "Taskline (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Open Taskline.apk on your phone to install." \
            --target "$GITHUB_SHA"
