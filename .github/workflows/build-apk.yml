name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle 8.9
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            msg=$(grep -E "^e: |error:|What went wrong|Execution failed|Could not |not found|FAILED|Caused by|^> " build.log | head -50 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::${msg}"
          fi
          exit $code

      - name: Keep the APK with the run
        uses: actions/upload-artifact@v4
        with:
          name: taskline-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK as a download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Taskline.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Taskline.apk \
            --title "Taskline (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Open Taskline.apk on your phone to install." \
            --target "$GITHUB_SHA"
